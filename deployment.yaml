apiVersion: apps/v1
kind: Deployment
metadata:
  name: personal-profile-deployment
spec:
  replicas: 2
  selector:
    matchLabels:
      app: personal-profile
  template:
    metadata:
      labels:
        app: personal-profile
    spec:
      containers:
      - name: profile-container
        image: dharukdharshan/personal-profile:v1
        ports:
        - containerPort: 80
---
apiVersion: v1
kind: Service
metadata:
  name: personal-profile-service
spec:
  type: NodePort
  selector:
    app: personal-profile
  ports:
    - port: 80
      targetPort: 80
      nodePort: 30081
